name: Daily NSE OI & Trade Performance Tracker

on:
  schedule:
    # Single daily run Mon-Fri at 5:30 PM IST (12:00 UTC) after NSE Bhavcopy is published
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

env:
  TZ: Asia/Kolkata

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance pandas websocket-client

      - name: Run EOD OI analysis
        run: |
          python fetch_oi_data.py

      - name: Archive daily snapshot & update index
        run: |
          mkdir -p history
          TODAY=$(date +'%Y-%m-%d')
          cp dashboard.html index.html
          cp dashboard.html history/dashboard-${TODAY}.html 2>/dev/null || true
          cp oi_data.json history/oi_data-${TODAY}.json 2>/dev/null || true

      - name: Commit daily updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard.html index.html oi_data.json trade_history.json oi_trading.db history/
          git commit -m "chore(auto): daily OI & trades performance update [skip ci]" || echo "No changes to commit"
          git push origin gh-pages


