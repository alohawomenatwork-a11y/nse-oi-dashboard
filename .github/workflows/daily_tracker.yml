name: Hourly & Daily NSE OI & Trade Performance Tracker

on:
  schedule:
    # Hourly runs Mon-Fri during Indian Market Hours (09:15 AM to 03:30 PM IST):
    # 04:20 UTC -> 09:50 AM IST (after 1st 35m of trading)
    # 05:20 UTC -> 10:50 AM IST
    # 06:20 UTC -> 11:50 AM IST
    # 07:20 UTC -> 12:50 PM IST
    # 08:20 UTC -> 01:50 PM IST
    # 09:20 UTC -> 02:50 PM IST
    - cron: '20 4-9 * * 1-5'
    # Market close 3:35 PM IST squareoff run:
    # 10:05 UTC -> 03:35 PM IST
    - cron: '5 10 * * 1-5'
    # EOD Final Bhavcopy run & daily archive:
    # 11:47 UTC -> 05:17 PM IST
    - cron: '47 11 * * 1-5'
  workflow_dispatch:

env:
  TZ: Asia/Kolkata

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance pandas websocket-client

      - name: Verify NSE Market is Open Today
        id: check_market
        if: github.event_name == 'schedule'
        run: |
          if python check_market_open.py; then
            echo "market_open=true" >> "$GITHUB_OUTPUT"
          else
            echo "market_open=false" >> "$GITHUB_OUTPUT"
            echo "Market is closed today (Weekend or NSE Holiday). Skipping update."
          fi

      - name: Run OI analysis & trade sync
        if: steps.check_market.outputs.market_open != 'false'
        run: |
          python fetch_oi_data.py

      - name: Archive daily snapshot & update index
        if: steps.check_market.outputs.market_open != 'false'
        run: |
          mkdir -p history
          TODAY=$(date +'%Y-%m-%d')
          cp dashboard.html index.html
          cp dashboard.html history/dashboard-${TODAY}.html 2>/dev/null || true
          cp oi_data.json history/oi_data-${TODAY}.json 2>/dev/null || true

      - name: Commit updates to gh-pages
        if: steps.check_market.outputs.market_open != 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard.html index.html oi_data.json trade_history.json trade_history_4d.json trade_history_5d.json oi_trading.db history/
          git commit -m "chore(auto): hourly market OI & trades performance update [skip ci]" || echo "No changes to commit"
          git push origin gh-pages

      - name: Sync to main
        if: steps.check_market.outputs.market_open != 'false'
        run: |
          git checkout main
          git merge gh-pages -m "chore(auto): sync hourly update to main [skip ci]" || true
          git push origin main || true
          git checkout gh-pages

      - name: Send Telegram Daily Summary (Post-Market)
        if: steps.check_market.outputs.market_open != 'false' && (github.event.schedule == '47 11 * * 1-5' || github.event_name == 'workflow_dispatch')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python telegram_notify.py || true
