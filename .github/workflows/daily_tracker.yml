name: Daily NSE OI & Trade Performance Tracker

on:
  schedule:
    # Multiple attempts Mon-Fri after NSE market close:
    # 1. 3:45 PM IST (10:15 UTC) - Initial attempt after 3:30 close
    # 2. 4:15 PM IST (10:45 UTC) - Standard NSE Bhavcopy publication window
    # 3. 4:45 PM IST (11:15 UTC) - Secondary fallback retry if delayed
    # 4. 5:30 PM IST (12:00 UTC) - Final evening sweep
    - cron: '15 10 * * 1-5'
    - cron: '45 10 * * 1-5'
    - cron: '15 11 * * 1-5'
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance pandas websocket-client

      - name: Run EOD OI analysis with Bhavcopy retry mechanism
        run: |
          python fetch_oi_data.py --wait-for-bhavcopy

      - name: Archive daily snapshot & update index
        run: |
          mkdir -p history
          TODAY=$(date +'%Y-%m-%d')
          cp dashboard.html index.html
          cp dashboard.html history/dashboard-${TODAY}.html 2>/dev/null || true
          cp oi_data.json history/oi_data-${TODAY}.json 2>/dev/null || true

      - name: Commit daily updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard.html index.html oi_data.json trade_history.json history/
          git commit -m "chore(auto): daily OI & trades performance update [skip ci]" || echo "No changes to commit"
          git push origin gh-pages


